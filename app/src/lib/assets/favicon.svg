  <polygon points="6,60 7,57.6 9,57 7,56.4 6,54 5,56.4 3,57 5,57.6" fill="#fff" opacity="0.7"/>
  <polygon points="122,68 123,65.6 125,65 123,64.4 122,62 121,64.4 119,65 121,65.6" fill="#fff" opacity="0.75"/>
  <polygon points="42,122 43,119.6 45,119 43,118.4 42,116 41,118.4 39,119 41,119.6" fill="#fff" opacity="0.7"/>
