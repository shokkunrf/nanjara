  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- Coin -->
  <circle cx="64" cy="64" r="52" fill="url(#coin)" stroke="#C8960C" stroke-width="3.5"/>
  <circle cx="64" cy="64" r="43" fill="none" stroke="#C8960C" stroke-width="2"/>
